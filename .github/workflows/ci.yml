name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libsqlite3-dev cppcheck gcovr

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DLMS_COVERAGE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Coverage
        run: |
          gcovr -r . --filter 'src/' --exclude 'src/main.cpp' --print-summary --xml-pretty -o coverage.xml

      - name: Static analysis (cppcheck)
        run: cppcheck --enable=warning,style,performance --std=c++17 --inline-suppr -I src src 2> cppcheck.txt || true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            coverage.xml
            cppcheck.txt
